services:
  - type: web
    name: ai-sentiment-analyzer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --timeout 180 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.2
      - key: MONGO_URI
        sync: false